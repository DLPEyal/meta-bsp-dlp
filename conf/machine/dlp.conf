#@TYPE: Machine
#@NAME: Custom OREL i.MX 8MP Machine
#@DESCRIPTION: Consolidated machine for i.MX 8M Plus EVK with LPDDR4 and DDR4
#@MAINTAINER: Orel Eliahu <orel@example.com>

# Base SoC overrides
MACHINEOVERRIDES =. "mx8mp:"
MACHINEOVERRIDES =. "${@bb.utils.contains('IMX_DEFAULT_BOOTLOADER', 'u-boot-imx', '', 'imx-boot-container:', d)}"

# Includes
require conf/machine/include/imx-base.inc
require conf/machine/include/arm/armv8a/tune-cortexa53.inc

# Tune
DEFAULTTUNE:use-mainline-bsp = "cortexa53-crypto"

# Machine features
MACHINE_FEATURES += "pci wifi bluetooth"
MACHINE_FEATURES:append:use-nxp-bsp = " optee jailhouse mrvl8997"

# Device trees (both LPDDR4 + DDR4 support)
KERNEL_DEVICETREE_BASENAME = "imx8mp-evk"

KERNEL_DEVICETREE = ""
# Comment out device trees which are not needed
KERNEL_DEVICETREE += " freescale/basearm1.dtb"
KERNEL_DEVICETREE += " freescale/basearm2.dtb"
KERNEL_DEVICETREE += " freescale/decoder.dtb"

UBOOT_DTB_NAME = "${KERNEL_DEVICETREE_BASENAME}.dtb"

# Bootloader selection
IMX_DEFAULT_BOOTLOADER:use-nxp-bsp = "u-boot-imx"
IMX_DEFAULT_BOOTLOADER:use-mainline-bsp = "u-boot-fslc"

# U-Boot configuration
UBOOT_CONFIG_BASENAME = "imx8mp_evk"
UBOOT_SUFFIX = "bin"
UBOOT_CONFIG ??= "sd"
UBOOT_CONFIG[fspi] = "${UBOOT_CONFIG_BASENAME}_defconfig"
UBOOT_CONFIG[ndm]  = "${UBOOT_CONFIG_BASENAME}_ndm_defconfig"
UBOOT_CONFIG[sd]      = "${UBOOT_CONFIG_BASENAME}_defconfig,sdcard"
UBOOT_CONFIG[ecc]     = "${UBOOT_CONFIG_BASENAME}_inline_ecc_defconfig"
UBOOT_CONFIG[mfgtool] = "${UBOOT_CONFIG_BASENAME}_defconfig"

SPL_BINARY = "spl/u-boot-spl.bin"
UBOOT_MAKE_TARGET = "all"

# ATF
ATF_PLATFORM = "imx8mp"

# DDR Firmware
DDR_FIRMWARE_VERSION = "202006"
DDR_FIRMWARE_NAME = " \
    lpddr4_pmu_train_1d_dmem_${DDR_FIRMWARE_VERSION}.bin \
    lpddr4_pmu_train_1d_imem_${DDR_FIRMWARE_VERSION}.bin \
    lpddr4_pmu_train_2d_dmem_${DDR_FIRMWARE_VERSION}.bin \
    lpddr4_pmu_train_2d_imem_${DDR_FIRMWARE_VERSION}.bin \
"

# Boot target
IMXBOOT_TARGETS_BASENAME = "flash_evk"
IMXBOOT_TARGETS = "${@bb.utils.contains('UBOOT_CONFIG', 'fspi', '${IMXBOOT_TARGETS_BASENAME}_flexspi', '${IMXBOOT_TARGETS_BASENAME}', d)}"
IMX_BOOT_SOC_TARGET = "iMX8MP"

# Serial console
SERIAL_CONSOLES = "115200;ttymxc1"

# Syslinux settings for mainline BSP
UBOOT_EXTLINUX:use-mainline-bsp = "1"
UBOOT_EXTLINUX_LABELS:use-mainline-bsp = "default"
UBOOT_EXTLINUX_DEFAULT_LABEL:use-mainline-bsp = "i.MX8M Plus EVK"
UBOOT_EXTLINUX_MENU_DESCRIPTION:default:use-mainline-bsp = "i.MX8M Plus EVK"
UBOOT_EXTLINUX_FDT:default:use-mainline-bsp     = "../${KERNEL_DEVICETREE_BASENAME}.dtb"
UBOOT_EXTLINUX_CONSOLE:default:use-mainline-bsp = "console=${console}"
UBOOT_EXTLINUX_ROOT:default:use-mainline-bsp    = "root=/dev/mmcblk1p2"
IMAGE_BOOT_FILES:append:use-mainline-bsp = " extlinux.conf;extlinux/extlinux.conf"

# Other settings
LOADADDR = ""
IMX_BOOT_SEEK = "32"
OPTEE_BIN_EXT = "8mp"
TEE_LOAD_ADDR = "0x40400000"

# Firmware
MACHINE_FIRMWARE:append = " linux-firmware-ath10k"

# Secure boot
# Secure boot enable/disable: Set to "0" to disable mandatory FIT image signature verification in U-Boot
# and disable adding public keys to u-boot dt
SECURE_BOOT_ENABLE = "1"
# Name and path for keys for secure boot. keys can be generated by scripts/generate-keys.sh 
SECBOOT_KEYNAME = "secboot"
SECBOOT_KEYDIR = "${BSPDIR}/secboot-keys"
# Generate signed fit image with kernel, device trees and initramfs
MACHINE_FEATURES += " fit"

# Add public keys to u-boot dt (only when secure boot is enabled)
UBOOT_SIGN_ENABLE = "${SECURE_BOOT_ENABLE}"
UBOOT_SIGN_KEYNAME = "${SECBOOT_KEYNAME}"
UBOOT_SIGN_KEYDIR = "${SECBOOT_KEYDIR}"

# Set kernel load address and entry point (it is overridden in imx-base.inc, so adding mx8m-generic-bsp)
UBOOT_ENTRYPOINT:mx8m-generic-bsp = "0x44000000"
UBOOT_LOADADDRESS:mx8m-generic-bsp = "0x44000000"
UBOOT_ENTRYSYMBOL:mx8m-generic-bsp = ""
#specify dtb load address
UBOOT_DTB_LOADADDRESS:mx8m-generic-bsp = "0x50000000"
# Specify ramdisk load address in FIT image for reliable boot
UBOOT_RD_LOADADDRESS  = "0x51000000"

# Add initramfs (actually rootfs) to a fit image
INITRAMFS_IMAGE = "core-image-minimal"
INITRAMFS_FSTYPES = "cpio.gz"
INITRAMFS_IMAGE_BUNDLE = "0"
